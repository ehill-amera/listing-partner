[project]
name = "listing-partner"
version = "0.1.0"
description = "One rental unit's bracketed exposures in, one listing package out."
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pillow",
    "rawpy",
    "opencv-python-headless",
    "exifread",
    "tifffile",
    "imagecodecs",
    # Meta's official SAM wire-grammar reader (decodes SAM 3.1's
    # arithmetic-coded mask payloads). SAM License, see
    # listing_partner/sam_data/ATTRIBUTION.md.
    "meta-sam-parser==0.1.0",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
