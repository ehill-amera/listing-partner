[project]
name = "listing-partner"
version = "0.1.0"
description = "One rental unit's bracketed exposures in, one listing package out."
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pillow",
    "rawpy",
    "opencv-python-headless",
    "exifread",
    "tifffile",
    "imagecodecs",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
